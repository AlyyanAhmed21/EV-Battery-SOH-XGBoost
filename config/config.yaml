artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  # This is where you must put your downloaded Colab files manually
  source_data_dir: research/data
  # This is the combined file the code will create
  local_data_file: artifacts/data_ingestion/merged_battery_data.csv

data_transformation:
  root_dir: artifacts/data_transformation
  data_path: artifacts/data_ingestion/merged_battery_data.csv
  status_file: artifacts/data_transformation/status.txt

model_trainer:
  root_dir: artifacts/model_trainer
  train_data_path: artifacts/data_transformation/train.csv
  test_data_path: artifacts/data_transformation/test.csv
  model_soh_name: model_soh.pkl
  model_capacity_name: model_capacity.pkl

model_evaluation:
  root_dir: artifacts/model_evaluation
  train_data_path: artifacts/data_transformation/train.csv
  test_data_path: artifacts/data_transformation/test.csv
  model_soh_path: artifacts/model_trainer/model_soh.pkl
  model_capacity_path: artifacts/model_trainer/model_capacity.pkl
  metric_file_name: artifacts/model_evaluation/metrics.json