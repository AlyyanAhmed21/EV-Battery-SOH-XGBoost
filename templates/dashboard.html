<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DIAGNOSTIC REPORT</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* THEME VARIABLES */
        :root {
            --bg-core: #f4f4f9;
            --bg-panel: #ffffff;
            --text-main: #1a1a1a;
            --text-dim: #555555;
            --border-tech: #cccccc;
            --accent-primary: #0056b3;
            --accent-secondary: #008b99;
        }
        [data-theme="dark"] {
            --bg-core: #050505;
            --bg-panel: #0f0f0f;
            --text-main: #e0e0e0;
            --text-dim: #666666;
            --border-tech: #333333;
            --accent-primary: #00f0ff;
            --accent-secondary: #ccff00;
        }

        body { background-color: var(--bg-core); color: var(--text-main); font-family: 'Rajdhani', sans-serif; padding: 40px; transition: 0.3s; }
        
        .header { border-bottom: 1px solid var(--border-tech); padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: end; }
        h1 { margin: 0; font-size: 32px; text-transform: uppercase; color: var(--text-main); }
        .file-tag { font-family: 'JetBrains Mono'; color: var(--accent-primary); font-size: 12px; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        
        .stat-card { 
            background: var(--bg-panel); 
            border: 1px solid var(--border-tech); 
            padding: 25px; position: relative; overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent-primary); }
        .stat-card.secondary::before { background: var(--accent-secondary); }
        
        .label { font-family: 'JetBrains Mono'; font-size: 12px; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 5px; }
        .value { font-size: 48px; font-weight: 700; line-height: 1; color: var(--text-main); }
        
        /* GRAPH CONTAINER: Now respects theme */
        .graph-panel { 
            border: 1px solid var(--border-tech); 
            background: var(--bg-panel); 
            padding: 10px; margin-bottom: 30px; text-align: center;
            border-radius: 4px;
        }
        
        .graph-img { width: 100%; max-width: 1100px; display: block; margin: 0 auto; }
        
        .btn { background: var(--bg-panel); border: 1px solid var(--border-tech); color: var(--text-dim); padding: 10px 20px; text-decoration: none; font-family: 'JetBrains Mono'; font-size: 12px; display: inline-block; transition: all 0.3s; }
        .btn:hover { border-color: var(--accent-primary); color: var(--text-main); }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>Single Unit Report</h1>
            <div class="file-tag">>> INPUT: {{ filename }}</div>
        </div>
        <div style="text-align: right; color: var(--text-dim); font-size: 12px; font-family: 'JetBrains Mono';">
            AI_MODEL: XGB_V2_PRO<br>STATUS: COMPLETE
        </div>
    </div>

    <div class="stat-grid">
        <div class="stat-card">
            <div class="label">ESTIMATED SOH</div>
            <div class="value" style="color: var(--accent-primary);">{{ soh }}</div>
        </div>
        <div class="stat-card secondary">
            <div class="label">PREDICTED RANGE</div>
            <div class="value" style="color: var(--text-main);">{{ total_cap }}</div>
        </div>
    </div>

    <div class="graph-panel">
        <img class="graph-img" src="data:image/png;base64, {{ plot }}">
    </div>

    <a href="/" class="btn"><< RETURN TO CONSOLE</a>

    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.body.setAttribute("data-theme", "dark");
        }
    </script>
</body>
</html>
