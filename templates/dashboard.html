<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analysis Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center; }
        
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 800px; margin: auto; }
        
        .stat-box { padding: 15px; border-radius: 10px; color: white; }
        .bg-green { background: #28a745; }
        .bg-blue { background: #007bff; }
        
        .value { font-size: 36px; font-weight: bold; }
        .label { font-size: 16px; opacity: 0.9; }
        
        img { max-width: 100%; height: auto; border-radius: 5px; border: 1px solid #ddd; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #343a40; color: white; text-decoration: none; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Battery Diagnostic Report</h1>
        <p>File: <strong>{{ filename }}</strong></p>
    </div>

    <div class="grid-container">
        <div class="stat-box bg-green">
            <div class="value">{{ soh }}</div>
            <div class="label">Estimated SOH</div>
        </div>
        <div class="stat-box bg-blue">
            <div class="value">{{ total_cap }}</div>
            <div class="label">Predicted Total Range</div>
        </div>
    </div>

    <br>

    <div class="card">
        <h3>🔋 AI Trajectory Projection</h3>
        <p><strong>Blue:</strong> Your Data | <strong>Orange:</strong> AI Predicted Future</p>
        <p>Status: {{ status }}</p>
        <img src="data:image/png;base64, {{ plots[0] }}" alt="Prediction Graph">
    </div>

    <div style="text-align: center;">
        <a href="/" class="btn">Analyze Another File</a>
    </div>

</body>
</html>
